services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: codlaxy-web
    container_name: codlaxy-web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./logs:/app/logs
    ports:
      - "8000:8000"
      - "5678:5678"  # For remote debugging
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=codlaxy.settings.development
      - POSTGRES_NAME=codlaxy_dev
      - POSTGRES_USER=codlaxy_dev
      - POSTGRES_PASSWORD=codlaxy_dev
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:13
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=codlaxy_dev
      - POSTGRES_USER=codlaxy_dev
      - POSTGRES_PASSWORD=codlaxy_dev
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codlaxy_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6380:6379"  # Different port to avoid conflicts
    volumes:
      - redis_data_dev:/data

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=dev@codlaxy.com
      - PGADMIN_DEFAULT_PASSWORD=devadmin
    ports:
      - "5051:80"  # Different port to avoid conflicts
    depends_on:
      - db

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web interface

volumes:
  postgres_data_dev:
  redis_data_dev:
  static_volume:
  media_volume: 